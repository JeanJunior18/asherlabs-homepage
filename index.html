<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHER LABS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeIn 1.5s ease-out;
        }

        svg {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.08));
            transition: filter 0.5s ease;
        }

        svg:hover {
            filter: drop-shadow(0px 0px 20px rgba(255, 255, 255, 0.2));
        }

        h1 {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5em;
            text-indent: 0.5em;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.65rem;
            color: #ffffff;
            opacity: 0.15;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="logo-container">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 10L90 33.1V79.4L50 90L10 79.4V33.1L50 10Z" stroke="#ffffff" stroke-width="1.5"
                stroke-opacity="0.2" stroke-linejoin="round" />

            <path d="M50 25L80 42.3V67.7L50 80L20 67.7V42.3L50 25Z" stroke="#ffffff" stroke-width="2.5"
                stroke-linejoin="round" stroke-linecap="round" />

            <circle cx="50" cy="52.5" r="4" fill="#ffffff" />
            <line x1="50" y1="25" x2="50" y2="48.5" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3" />
        </svg>

        <h1>Asher Labs</h1>
    </div>

    <div class="footer">
        Private Ecosystem
    </div>

</body>

</html>
