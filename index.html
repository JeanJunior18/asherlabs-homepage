<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ASHER LABS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050505;
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.34);
            --line: rgba(255, 255, 255, 0.04);

            --cyan: #00dfd8;
            --blue: #007cf0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(circle at top,
                    rgba(0, 124, 240, 0.08),
                    transparent 35%),

                radial-gradient(circle at bottom,
                    rgba(0, 223, 216, 0.05),
                    transparent 40%),

                var(--bg);

            font-family: "Inter", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        body::before {
            content: "";

            position: absolute;
            inset: 0;

            opacity: 0.025;

            background-image:
                repeating-linear-gradient(0deg,
                    rgba(255, 255, 255, 0.03) 0px,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px,
                    transparent 2px);

            pointer-events: none;
        }

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);

            background-size: 56px 56px;

            mask-image:
                radial-gradient(circle at center,
                    black 20%,
                    transparent 80%);

            opacity: 0.45;
        }

        .hero {
            position: relative;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 28px;

            padding-inline: 24px;

            text-align: center;
        }

        .logo {
            width: 92px;
            height: 92px;

            filter:
                drop-shadow(0 0 30px rgba(0, 223, 216, 0.08));
        }

        h1 {
            font-size: clamp(0.82rem, 2vw, 1rem);

            font-weight: 300;

            text-transform: uppercase;

            letter-spacing: clamp(0.42em, 1.6vw, 0.62em);

            text-indent: clamp(0.42em, 1.6vw, 0.62em);

            color: white;
        }

        h1 strong {
            font-weight: 600;

            background:
                linear-gradient(90deg,
                    var(--cyan),
                    var(--blue));

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: clamp(0.56rem, 1.7vw, 0.72rem);

            text-transform: uppercase;

            letter-spacing: clamp(0.22em, 0.8vw, 0.32em);

            color: var(--muted);

            line-height: 1.8;
        }

        .footer {
            position: absolute;

            bottom: 28px;

            width: 100%;

            text-align: center;

            padding-inline: 24px;

            font-size: clamp(0.46rem, 1.5vw, 0.58rem);

            letter-spacing: 0.24em;

            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.18);
        }

        @media (max-width: 640px) {

            .grid {
                background-size: 42px 42px;
                opacity: 0.32;
            }

            .hero {
                gap: 22px;
            }

            .logo {
                width: 78px;
                height: 78px;
            }
        }
    </style>
</head>

<body>

    <div class="grid"></div>

    <main class="hero">

        <img src="logo.svg" alt="ASHER LABS" class="logo">

        <h1>
            ASHER <strong>LABS</strong>
        </h1>

        <p>
            Infrastructure • Automation • Systems
        </p>

    </main>

    <div class="footer">
        Private Infrastructure Ecosystem
    </div>

</body>

</html>
