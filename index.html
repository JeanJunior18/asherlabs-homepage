<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ASHER LABS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050505;
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.34);
            --line: rgba(255, 255, 255, 0.04);

            --cyan: #00dfd8;
            --blue: #007cf0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(circle at top,
                    rgba(0, 124, 240, 0.08),
                    transparent 35%),

                radial-gradient(circle at bottom,
                    rgba(0, 223, 216, 0.05),
                    transparent 40%),

                var(--bg);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        /* subtle grain */
        body::before {
            content: "";

            position: absolute;
            inset: 0;

            opacity: 0.025;

            background-image:
                repeating-linear-gradient(0deg,
                    rgba(255, 255, 255, 0.03) 0px,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px,
                    transparent 2px);

            pointer-events: none;
        }

        /* grid */
        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);

            background-size: 56px 56px;

            mask-image:
                radial-gradient(circle at center,
                    black 20%,
                    transparent 80%);

            opacity: 0.45;
        }

        /* orbital structure */
        .orbital {
            position: absolute;

            width: min(82vw, 560px);
            height: min(82vw, 560px);

            border-radius: 50%;

            border: 1px solid rgba(255, 255, 255, 0.03);

            display: flex;
            align-items: center;
            justify-content: center;

            animation: rotate 90s linear infinite;
        }

        .orbital::before,
        .orbital::after {
            content: "";

            position: absolute;
            border-radius: 50%;

            border: 1px solid rgba(255, 255, 255, 0.035);
        }

        .orbital::before {
            width: 68%;
            height: 68%;
        }

        .orbital::after {
            width: 34%;
            height: 34%;
        }

        /* nodes */
        .node {
            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.25),
                0 0 26px rgba(0, 223, 216, 0.12);
        }

        .n1 {
            top: 24%;
            left: 18%;
        }

        .n2 {
            top: 44%;
            right: 17%;
            background: var(--cyan);
        }

        .n3 {
            bottom: 22%;
            left: 31%;
            background: var(--blue);
        }

        .n4 {
            bottom: 12%;
            right: 32%;
        }

        /* hero */
        .hero {
            position: relative;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 18px;

            padding-inline: 24px;

            text-align: center;

            animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* minimal mark */
        .mark {
            width: 62px;
            height: 62px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(135deg,
                    rgba(0, 223, 216, 0.08),
                    rgba(0, 124, 240, 0.08));

            border:
                1px solid rgba(255, 255, 255, 0.06);

            backdrop-filter: blur(20px);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.03),
                0 0 30px rgba(0, 223, 216, 0.06);
        }

        .mark span {
            font-size: 0.9rem;

            font-weight: 600;

            letter-spacing: 0.18em;

            color: rgba(255, 255, 255, 0.92);
        }

        h1 {
            font-size: clamp(0.72rem, 2vw, 0.95rem);

            font-weight: 300;

            text-transform: uppercase;

            letter-spacing: clamp(0.32em, 1.6vw, 0.58em);

            text-indent: clamp(0.32em, 1.6vw, 0.58em);

            color: white;
        }

        h1 strong {
            font-weight: 600;

            background:
                linear-gradient(90deg,
                    var(--cyan),
                    var(--blue));

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: clamp(0.52rem, 1.7vw, 0.68rem);

            text-transform: uppercase;

            letter-spacing: clamp(0.18em, 0.8vw, 0.28em);

            color: var(--muted);

            line-height: 1.8;
        }

        .footer {
            position: absolute;

            bottom: 26px;

            width: 100%;

            text-align: center;

            padding-inline: 24px;

            font-size: clamp(0.46rem, 1.5vw, 0.58rem);

            letter-spacing: 0.24em;

            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.18);
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        @media (max-width: 640px) {

            .grid {
                background-size: 42px 42px;
                opacity: 0.32;
            }

            .orbital {
                width: 92vw;
                height: 92vw;

                opacity: 0.7;
            }

            .node {
                transform: scale(0.9);
            }

            .hero {
                gap: 16px;
            }

            .mark {
                width: 56px;
                height: 56px;
            }

            .footer {
                bottom: 20px;
                line-height: 1.8;
            }
        }
    </style>
</head>

<body>

    <div class="grid"></div>

    <div class="orbital">
        <div class="node n1"></div>
        <div class="node n2"></div>
        <div class="node n3"></div>
        <div class="node n4"></div>
    </div>

    <main class="hero">

        <div class="mark">
            <span>AL</span>
        </div>

        <h1>
            ASHER <strong>LABS</strong>
        </h1>

        <p>
            Infrastructure • Automation • Systems
        </p>

    </main>

    <div class="footer">
        Private Infrastructure Ecosystem
    </div>

</body>

</html>
